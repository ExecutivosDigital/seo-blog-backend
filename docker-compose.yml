services:
  postgres:
    image: postgres:16-alpine
    container_name: seoblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seoblog
      POSTGRES_PASSWORD: seoblog
      POSTGRES_DB: seoblog
    ports:
      - "5432:5432"
    volumes:
      - seoblog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoblog -d seoblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seoblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - seoblog-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seoblog-postgres-data:
  seoblog-redis-data:
